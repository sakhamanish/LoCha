# Builds LoCha.exe on Windows and tests it; optionally publishes a release.
#
# Runs only when asked: from the Actions tab ("Run workflow"), or on a push
# whose commit message contains [build-exe]. Ordinary pushes don't start it.
# Entering a version (e.g. v1.0.0) when running it from the Actions tab also
# publishes a GitHub Release with the tested Windows zip.
name: Windows exe build

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish (e.g. v1.0.0). Leave empty to only build and test."
        required: false
        default: ""
  push:

permissions:
  contents: write  # to publish releases

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-exe]')
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller==6.22.3"

      - name: Build LoCha.exe (same as build_exe.ps1)
        run: pyinstaller LoCha.spec --noconfirm --clean --workpath build

      - name: Start LoCha.exe and check it keeps running
        run: |
          $env:OLLAMA_HOST = "127.0.0.1:1"  # no Ollama here; LoCha must cope
          $app = Start-Process dist\LoCha\LoCha.exe -PassThru
          Start-Sleep -Seconds 120  # also downloads and loads the search model
          $log = Join-Path $env:LOCALAPPDATA "LoCha\locha.log"
          if (Test-Path $log) { Get-Content $log }
          if ($app.HasExited) { throw "LoCha.exe stopped early (exit code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Traceback|warm-up failed" -Quiet)) {
            throw "Errors in locha.log (see above)"
          }
          Write-Host "LoCha.exe ran for 2 minutes without errors."

      - name: Build the end-to-end test program from the same recipe
        run: |
          python tests/make_smoke_spec.py
          pyinstaller LoChaSmoke.spec --noconfirm --workpath build

      - name: Run the end-to-end test inside the built program
        run: |
          dist\LoChaSmoke\LoChaSmoke.exe tests\sample.pdf
          if ($LASTEXITCODE -ne 0) { throw "End-to-end test failed (exit code $LASTEXITCODE)" }

      - name: Upload the LoCha folder
        # Large (torch); may not fit a free plan's artifact storage.
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LoCha-windows
          path: dist/LoCha
          retention-days: 3
          compression-level: 9
          # Keep folders starting with "." (e.g. sklearn\.libs\vcomp140.dll);
          # by default they're left out and the downloaded LoCha.exe fails.
          include-hidden-files: true

      - name: Download the uploaded zip and check LoCha.exe starts from it
        if: steps.upload.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          name: LoCha-windows
          path: downloaded

      - name: Start LoCha.exe from the downloaded zip
        if: steps.upload.outcome == 'success'
        run: |
          $env:OLLAMA_HOST = "127.0.0.1:1"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "downloaded-appdata"
          $app = Start-Process downloaded\LoCha.exe -PassThru
          Start-Sleep -Seconds 90
          $log = Join-Path $env:LOCALAPPDATA "LoCha\locha.log"
          if (Test-Path $log) { Get-Content $log }
          if ($app.HasExited) { throw "LoCha.exe from the download stopped early (exit code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Traceback|warm-up failed" -Quiet)) {
            throw "Errors in locha.log (see above)"
          }
          Write-Host "LoCha.exe from the downloaded zip ran for 90 seconds without errors."

      - name: Package the release zip and check LoCha.exe starts from it
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          VERSION: ${{ inputs.release_version }}
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+$') { throw "Version must look like v1.0.0" }
          $zip = "LoCha-$env:VERSION-windows.zip"
          # 7-Zip keeps hidden folders such as sklearn\.libs (Compress-Archive doesn't).
          7z a -tzip -mx=9 $zip .\dist\LoCha\* | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
          7z x $zip -orelease-check | Out-Null
          $env:OLLAMA_HOST = "127.0.0.1:1"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "release-appdata"
          $app = Start-Process release-check\LoCha.exe -PassThru
          Start-Sleep -Seconds 90
          $log = Join-Path $env:LOCALAPPDATA "LoCha\locha.log"
          if (Test-Path $log) { Get-Content $log }
          if ($app.HasExited) { throw "LoCha.exe from the release zip stopped early (exit code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Traceback|warm-up failed" -Quiet)) {
            throw "Errors in locha.log (see above)"
          }
          Write-Host "Release zip OK: $zip ($([math]::Round((Get-Item $zip).Length / 1MB)) MB)"

      - name: Publish the GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release_version }}
        run: |
          gh release create $env:VERSION "LoCha-$env:VERSION-windows.zip" `
            --target $env:GITHUB_SHA `
            --title "LoCha $env:VERSION" `
            --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }
